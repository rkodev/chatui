[package]
name = "chatui-backup"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chatui-domain = { version = "0.1.0", path = "../chatui-domain" }
flate2 = "1"
jsonschema = { version = "0.60", default-features = false }
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
