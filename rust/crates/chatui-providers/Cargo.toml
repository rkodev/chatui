[package]
name = "chatui-providers"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chatui-domain = { path = "../chatui-domain" }
futures-util = "0.3"
reqwest = { version = "0.12.24", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls",
  "stream",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
chatui-conformance = { path = "../../tests/conformance" }
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
wiremock = "0.6"
