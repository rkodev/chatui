[package]
name = "chatui-storage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
chatui-domain = { path = "../chatui-domain" }
directories = "6"
serde = "1"
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
