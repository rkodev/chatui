[package]
name = "chatui-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arboard = "3"
chatui-domain = { path = "../../crates/chatui-domain" }
chatui-storage = { path = "../../crates/chatui-storage" }
chatui-ui = { path = "../../crates/chatui-ui" }
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18.1"
url = "2"

[dev-dependencies]
i-slint-backend-testing = "1.18.1"
tempfile = "3"
