# Dependency policy for the ChatUI Rust workspace.
#
# This is intentionally conservative. Do not disable a check to make the gate
# pass; add a narrowly scoped exception with a comment and a follow-up owner
# instead. Final release tuning is owned by M3.5-11.1.

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
notice = "warn"
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Workspace crates are private (`publish = false`) and do not carry a license
# field yet; ignore them rather than inventing a license for the skeleton.
private = { ignore = true }
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
