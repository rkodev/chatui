name: Rust

# Rust desktop is post-preview / parallel for the phase 1 preview (DEC-M4-01).
# This workflow is not a phase 1 release deliverable; see
# docs/operations/M4/release.md. It remains available for the parallel Rust
# track and for the scheduled supply-chain checks.
"on":
  pull_request:
  push:
    branches:
      # The specification names `main`; the repository currently uses `dev` as
      # its default branch, so both are listed until the branch is renamed.
      - main
      - dev
    tags:
      - "v*"
      - "beta-*"
  schedule:
    # Weekly dependency-policy and advisory check, per spec section 16.3.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          paths: |
            rust/**
            contracts/**
            .github/workflows/rust.yml
            .github/actions/detect-changes/**

  rust:
    name: Rust gates (${{ matrix.name }})
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # TODO: Re-enable macOS and Windows gates once cross-platform support is ready.
          # - name: macOS Apple Silicon
          #   os: macos-14
          #   target: aarch64-apple-darwin
          # - name: Windows x86_64
          #   os: windows-latest
          #   target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libgtk-3-dev

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error::Could not read channel from rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: rust
        run: cargo nextest run --workspace

      - name: Conformance
        working-directory: rust
        run: cargo nextest run -p chatui-conformance

      - name: Release build
        working-directory: rust
        run: cargo build --release --workspace --locked

  supply-chain:
    name: Supply chain (deny and audit)
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust/rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error::Could not read channel from rust/rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: Dependency policy
        working-directory: rust
        run: cargo deny check

      - name: Security advisories
        working-directory: rust
        run: cargo audit
