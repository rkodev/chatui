[package]
name = "chatui-providers"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chatui-domain = { path = "../chatui-domain" }
reqwest = { version = "0.12.24", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls",
  "stream",
] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
