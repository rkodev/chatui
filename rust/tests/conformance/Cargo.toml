[package]
name = "chatui-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chatui-contracts = { path = "../../crates/chatui-contracts" }
chatui-domain = { path = "../../crates/chatui-domain" }
chatui-storage = { path = "../../crates/chatui-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
chatui-providers = { path = "../../crates/chatui-providers" }
tempfile = "3"
wiremock = "0.6"
