# Dependency policy for the ChatUI Rust workspace.
#
# This is intentionally conservative. Do not disable a check to make the gate
# pass; add a narrowly scoped exception with a comment and a follow-up owner
# instead. Final release tuning is owned by M3.5-11.1.

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Vulnerability and notice advisories are denied by default since cargo-deny
# 0.16. The `unmaintained` and `unsound` fields now select which crates are
# checked; matching advisories are denied. Scope them to the workspace so the
# noise from transitive UI dependencies does not hide maintainability risks in
# crates we directly control.
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"
# RUSTSEC-2026-0459 (CVE-2026-119375, bundled SQLite page-cache disclosure):
# sqlx 0.8.6 pins `libsqlite3-sys` to `0.30.x`, so the patched 0.39.x release
# cannot be selected yet. Upstream has relaxed the bound on `main` (sqlx PR
# #4502) but has not published a release. Remove this exception once a sqlx
# release allows `libsqlite3-sys >=0.39.0`. Follow-up owner: dependency policy.
ignore = ["RUSTSEC-2026-0459"]

[licenses]
version = 2
confidence-threshold = 0.93
# Workspace crates are private (`publish = false`) and do not carry a license
# field yet; ignore them rather than inventing a license for the skeleton.
private = { ignore = true }
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # Slint is triple-licensed; the desktop app is distributed under the
  # royalty-free license rather than the GPL option.
  "LicenseRef-Slint-Royalty-free-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
