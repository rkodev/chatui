name: Contracts

# The shared validator is the contract conformance gate for every enabled
# client. It compiles the JSON Schemas, validates every fixture (including the
# OpenRouter stream/error fixtures), checks the parity file, and fails on any
# schema, fixture, or parity mismatch. Web and Android consume the same fixtures
# in their own workflows; Rust is post-preview / parallel (DEC-M4-01).
"on":
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        uses: ./.github/actions/detect-changes
        with:
          paths: |
            contracts/**
            scripts/**
            Makefile
            .github/workflows/contracts.yml
            .github/actions/detect-changes/**

  validate:
    name: Validate contracts
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install contract validator dependencies
        run: npm ci --prefix scripts

      - name: Validate schemas, fixtures, and parity
        run: make contracts-check
