name: Detect relevant changes
description: >-
  Reports whether any watched paths changed for the current event. Tag pushes
  and manual dispatches always report a relevant change so release and on-demand
  runs are never skipped.

inputs:
  paths:
    description: Newline-separated list of path globs to watch.
    required: true

outputs:
  relevant:
    description: "'true' when a watched path changed or the event always runs."
    value: ${{ steps.detect.outputs.relevant }}

runs:
  using: composite
  steps:
    - name: Detect relevant changes
      id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        WATCH_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail

        if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF" == refs/tags/* ]]; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        mapfile -t paths < <(printf '%s\n' "$WATCH_PATHS" | sed '/^[[:space:]]*$/d')
        if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "${paths[@]}"; then
          echo "relevant=false" >> "$GITHUB_OUTPUT"
        else
          echo "relevant=true" >> "$GITHUB_OUTPUT"
        fi
