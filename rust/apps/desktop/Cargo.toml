[package]
name = "chatui-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
arboard = "3"
base64 = "0.22"
chatui-domain = { path = "../../crates/chatui-domain" }
chatui-storage = { path = "../../crates/chatui-storage" }
chatui-ui = { path = "../../crates/chatui-ui" }
ed25519-dalek = "2.1"
hex = "0.4"
reqwest = { version = "0.12.24", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.18.1"
url = "2"

[dev-dependencies]
i-slint-backend-testing = "1.18.1"
tempfile = "3"
