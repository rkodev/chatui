[package]
name = "chatui-storage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chatui-contracts = { version = "0.1.0", path = "../chatui-contracts" }
chatui-domain = { version = "0.1.0", path = "../chatui-domain" }
directories = "6"
hex = "0.4"
rand = "0.8"
serde = "1"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
