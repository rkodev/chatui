[package]
name = "chatui-secrets"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
directories = "6"
keyring = { version = "3.6", default-features = false, features = [
  "apple-native",
  "crypto-rust",
  "sync-secret-service",
  "windows-native",
] }
rand = "0.8"
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
