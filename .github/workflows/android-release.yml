name: Android Release

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Positive integer versionCode (defaults to the full-history commit count)"
        required: false
        type: string
      version_name:
        description: "Semantic versionName (defaults to the tag, otherwise 0.1.0-dev)"
        required: false
        type: string
      run_connected_tests:
        description: "Run connected instrumentation tests on an emulator"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history keeps the git commit-count versionCode monotonic.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        # Pinned to the v4.4.4 commit so local `act` runs can resolve the action.
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install contract validator dependencies
        run: npm ci --prefix scripts

      - name: Validate contracts
        run: make contracts-check

      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}. A debug key is never substituted."
            exit 1
          fi

      - name: Run lint and unit tests
        run: |
          make android-lint
          make android-test

      - name: Verify screenshots
        run: make android-screenshot

      - name: Build signed release artifacts
        env:
          RELEASE_SIGNING_REQUIRED: "true"
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          aab="$(find android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)"
          if [ -z "$apk" ] || [ -z "$aab" ]; then
            echo "::error::Expected a signed release APK and AAB, but one was not produced."
            exit 1
          fi
          if [[ "$apk" == *unsigned* ]]; then
            echo "::error::Release APK is unsigned; refusing to publish it."
            exit 1
          fi
          sha256sum "$apk" "$aab" > android/app/build/outputs/checksums.txt
          cat android/app/build/outputs/checksums.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload release mapping
        uses: actions/upload-artifact@v4
        with:
          name: android-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: android-release-checksums
          path: android/app/build/outputs/checksums.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload screenshot verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-report
          path: |
            android/app/build/outputs/roborazzi
            android/app/build/reports/tests
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload connected-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-connected-test-report
          path: |
            android/app/build/outputs/androidTest-results
            android/app/build/reports/androidTests
          retention-days: 14
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          aab="$(find android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Signed Android release ${GITHUB_REF_NAME}." \
            "$apk" \
            "$aab" \
            android/app/build/outputs/mapping/release/mapping.txt \
            android/app/build/outputs/checksums.txt

  connected-tests:
    name: Connected instrumentation tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_connected_tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: make android-test-ui

      - name: Upload connected-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-connected-test-report
          path: |
            android/app/build/outputs/androidTest-results
            android/app/build/reports/androidTests
          retention-days: 14
          if-no-files-found: ignore
