[package]
name = "chatui-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
chatui-contracts = { version = "0.1.0", path = "../chatui-contracts" }
chatui-domain = { version = "0.1.0", path = "../chatui-domain" }
chatui-providers = { version = "0.1.0", path = "../chatui-providers" }
chatui-secrets = { version = "0.1.0", path = "../chatui-secrets" }
chatui-storage = { version = "0.1.0", path = "../chatui-storage" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
slint = "1.18.1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[dev-dependencies]
i-slint-backend-testing = { version = "1.18.1", features = ["renderer-software"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
