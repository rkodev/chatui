[workspace]
resolver = "3"
members = [
  "crates/chatui-domain",
  "crates/chatui-contracts",
  "crates/chatui-providers",
  "crates/chatui-storage",
  "crates/chatui-secrets",
  "crates/chatui-ui",
  "apps/desktop",
  "tests/conformance",
]

# Release-profile skeleton. Final tuning, symbol artifacts, and packaging are
# owned by M3.5-11.1 and M3.5-11.2.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
